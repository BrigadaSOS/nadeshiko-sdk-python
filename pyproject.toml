[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nadeshiko-sdk-python-monorepo"
version = "0.0.0"
description = "Tooling workspace for Nadeshiko Python SDK monorepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "openapi-python-client>=0.22.0",
    "pyyaml>=6.0",
    "pytest>=9.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
generate = "python scripts/generate.py --sdk-type all"
generate-public = "python scripts/generate.py --sdk-type public"
generate-internal = "python scripts/generate.py --sdk-type internal"
build-public = "python scripts/build_package.py public"
build-internal = "python scripts/build_package.py internal"
lint = "ruff check scripts"
