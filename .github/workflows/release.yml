name: Release

on:
  repository_dispatch:
    types:
      - backend_release
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel: dev or stable"
        required: true
        type: choice
        options:
          - stable
          - dev
        default: stable
      backend_sha:
        description: "Backend commit SHA used for this release"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: sdk-release-${{ inputs.release_channel || github.event.client_payload.release_channel || 'stable' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'

      - name: Validate payload
        id: payload
        run: python scripts/validate_payload.py

      - name: Check PyPI for existing versions
        id: pypi_check
        run: |
          set -euo pipefail
          CHANNEL="${{ steps.payload.outputs.release_channel }}"

          PUBLIC_EXISTS="false"
          if [[ "${CHANNEL}" == "stable" ]]; then
            VERSION="${{ steps.payload.outputs.public_version }}"
            if curl -sf "https://pypi.org/pypi/nadeshiko-sdk/${VERSION}/json" > /dev/null 2>&1; then
              PUBLIC_EXISTS="true"
            fi
          fi

          INTERNAL_EXISTS="false"
          VERSION="${{ steps.payload.outputs.internal_version }}"
          if curl -sf "https://pypi.org/pypi/nadeshiko-internal-sdk/${VERSION}/json" > /dev/null 2>&1; then
            INTERNAL_EXISTS="true"
          fi

          echo "public_exists=${PUBLIC_EXISTS}" >> "$GITHUB_OUTPUT"
          echo "internal_exists=${INTERNAL_EXISTS}" >> "$GITHUB_OUTPUT"

      - name: Check if release should be skipped
        id: skip
        run: |
          set -euo pipefail
          SKIP="false"
          SKIP_REASON=""
          CHANNEL="${{ steps.payload.outputs.release_channel }}"

          if [[ "${CHANNEL}" == "dev" ]]; then
            if [[ "${{ steps.pypi_check.outputs.internal_exists }}" == "true" ]]; then
              SKIP="true"
              SKIP_REASON="dev version already exists on PyPI"
            fi
          else
            if [[ "${{ steps.pypi_check.outputs.public_exists }}" == "true" && "${{ steps.pypi_check.outputs.internal_exists }}" == "true" ]]; then
              SKIP="true"
              SKIP_REASON="both public and internal versions already exist on PyPI"
            fi
          fi

          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${SKIP_REASON}" >> "$GITHUB_OUTPUT"

      - name: Skip summary
        if: steps.skip.outputs.skip == 'true'
        run: |
          {
            echo "## Python SDK Release Skipped"
            echo ""
            echo "- Reason: ${{ steps.skip.outputs.skip_reason }}"
            echo "- Channel: \`${{ steps.payload.outputs.release_channel }}\`"
            echo "- Spec version: \`${{ steps.payload.outputs.spec_version }}\`"
            echo "- Internal version: \`nadeshiko-internal-sdk==${{ steps.payload.outputs.internal_version }}\`"
            echo "- Bump the spec version to publish a new release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate SDK
        if: steps.skip.outputs.skip != 'true'
        env:
          OPENAPI_SPEC_PATH: ${{ steps.payload.outputs.spec_url }}
        run: |
          if [[ "${{ steps.payload.outputs.release_channel }}" == "dev" ]]; then
            python scripts/generate.py --sdk-type internal
          else
            python scripts/generate.py --sdk-type all
          fi

      - name: Set versions
        if: steps.skip.outputs.skip != 'true'
        env:
          PUBLIC_VERSION: ${{ steps.payload.outputs.public_version }}
          INTERNAL_VERSION: ${{ steps.payload.outputs.internal_version }}
        run: |
          echo "__version__ = \"${PUBLIC_VERSION}\"" > generated/public/nadeshiko/_version.py
          echo "__version__ = \"${INTERNAL_VERSION}\"" > generated/internal/nadeshiko_internal/_version.py

      - name: Build packages
        if: steps.skip.outputs.skip != 'true'
        env:
          SDK_VERSION: ${{ steps.payload.outputs.public_version }}
          INTERNAL_VERSION: ${{ steps.payload.outputs.internal_version }}
        run: |
          if [[ "${{ steps.payload.outputs.release_channel }}" == "dev" ]]; then
            python scripts/build_package.py internal
          else
            python scripts/build_package.py public
            python scripts/build_package.py internal
          fi

      - name: Smoke test built wheels
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: |
          python -m venv /tmp/nadeshiko-release-smoke
          source /tmp/nadeshiko-release-smoke/bin/activate
          python -m pip install --upgrade pip
          CHANNEL="${{ steps.payload.outputs.release_channel }}"
          if [[ "${CHANNEL}" != "dev" ]]; then
            python -m pip install build/public/dist/*.whl
            python -c "import nadeshiko; print('nadeshiko:', nadeshiko.__version__)"
          fi
          python -m pip install build/internal/dist/*.whl
          python -c "import nadeshiko_internal; print('nadeshiko_internal:', nadeshiko_internal.__version__)"

      - name: Commit and push
        if: steps.skip.outputs.skip != 'true' && steps.payload.outputs.release_channel == 'stable'
        env:
          VERSION: ${{ steps.payload.outputs.spec_version }}
          BACKEND_SHA: ${{ steps.payload.outputs.backend_sha }}
          BACKEND_REPO: ${{ steps.payload.outputs.backend_repo }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            generated/public \
            generated/internal

          if git diff --cached --quiet; then
            echo "No generated changes detected; skipping commit."
          else
            git commit -m "chore(release): SDK ${VERSION} for ${BACKEND_REPO}@${BACKEND_SHA}"
            git push origin "HEAD:${BASE_BRANCH}"
          fi

      - name: Publish public package to PyPI
        if: steps.skip.outputs.skip != 'true' && steps.payload.outputs.release_channel == 'stable' && steps.pypi_check.outputs.public_exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: build/public/dist/

      - name: Publish internal package to PyPI
        if: steps.skip.outputs.skip != 'true' && steps.pypi_check.outputs.internal_exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: build/internal/dist/

      - name: Create tag
        if: steps.skip.outputs.skip != 'true' && steps.payload.outputs.release_channel == 'stable'
        env:
          RELEASE_TAG: ${{ steps.payload.outputs.release_tag }}
          BACKEND_SHA: ${{ steps.payload.outputs.backend_sha }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | grep -q .; then
            echo "Tag ${RELEASE_TAG} already exists."
          else
            git tag -a "${RELEASE_TAG}" -m "SDK release ${RELEASE_TAG} (backend ${BACKEND_SHA})"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Create GitHub release
        if: steps.skip.outputs.skip != 'true' && steps.payload.outputs.release_channel == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.payload.outputs.release_tag }}
          name: Python SDK ${{ steps.payload.outputs.release_tag }}
          prerelease: ${{ steps.payload.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            build/public/dist/*
            build/internal/dist/*
          body: |
            Backend-driven Python SDK release.

            - Backend: `${{ steps.payload.outputs.backend_repo }}`
            - Backend SHA: `${{ steps.payload.outputs.backend_sha }}`
            - OpenAPI spec: `${{ steps.payload.outputs.spec_url }}`
            - Spec version: `${{ steps.payload.outputs.spec_version }}`
            - PyPI public: `nadeshiko-sdk==${{ steps.payload.outputs.public_version }}`
            - PyPI internal: `nadeshiko-internal-sdk==${{ steps.payload.outputs.internal_version }}`

      - name: Summary
        if: steps.skip.outputs.skip != 'true'
        run: |
          CHANNEL="${{ steps.payload.outputs.release_channel }}"
          {
            echo "## Python SDK Release Published"
            echo ""
            echo "- Channel: \`${CHANNEL}\`"
            echo "- Spec version: \`${{ steps.payload.outputs.spec_version }}\`"
            if [[ "${CHANNEL}" == "stable" ]]; then
              echo "- Tag: \`${{ steps.payload.outputs.release_tag }}\`"
              echo "- PyPI public: \`nadeshiko-sdk==${{ steps.payload.outputs.public_version }}\`"
            fi
            echo "- PyPI internal: \`nadeshiko-internal-sdk==${{ steps.payload.outputs.internal_version }}\`"
            echo "- Backend: \`${{ steps.payload.outputs.backend_repo }}@${{ steps.payload.outputs.backend_sha }}\`"
            echo "- Spec URL: \`${{ steps.payload.outputs.spec_url }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
