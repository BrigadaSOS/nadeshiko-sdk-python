name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint scripts
        run: ruff check scripts

      - name: Generate SDKs
        run: python scripts/generate.py --sdk-type all

      - name: Build package artifacts
        run: |
          python scripts/build_package.py public
          python scripts/build_package.py internal

      - name: Smoke test wheel installation
        shell: bash
        run: |
          python -m venv /tmp/nadeshiko-smoke
          source /tmp/nadeshiko-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install build/public/dist/*.whl build/internal/dist/*.whl
          python -c "import nadeshiko; print('nadeshiko:', nadeshiko.__version__)"
          python -c "import nadeshiko_internal; print('nadeshiko_internal:', nadeshiko_internal.__version__)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: |
            build/public/dist
            build/internal/dist
