[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nadeshiko-internal-sdk"
dynamic = ["version"]
description = "Python SDK for Nadeshiko API (internal endpoints)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "attrs>=23.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.8.0",
]

[tool.hatch.version]
path = "src/nadeshiko_internal/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nadeshiko_internal"]
